<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экраны приложения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Стенд */
:root {
  --stand-bg: #E4E7EB; --stand-ink: #1C232D; --stand-muted: #5A6472; --stand-tab: #FFFFFF; --stand-on: #1C232D; --stand-on-ink: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --stand-bg: #1A1F26; --stand-ink: #E8ECF1; --stand-muted: #9AA4B2; --stand-tab: #262D37; --stand-on: #E8ECF1; --stand-on-ink: #1A1F26; }
}
:root[data-theme="dark"] { --stand-bg: #1A1F26; --stand-ink: #E8ECF1; --stand-muted: #9AA4B2; --stand-tab: #262D37; --stand-on: #E8ECF1; --stand-on-ink: #1A1F26; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--stand-bg); color: var(--stand-ink); font: 15px/1.5 "Onest", system-ui, sans-serif; }
.stand { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
.stand h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
.stand > p { margin: 0 0 16px; color: var(--stand-muted); max-width: 72ch; }
.tabs { display: flex; gap: 8px; margin-bottom: 24px; }
.tabs button { font: 500 15px "Onest", sans-serif; border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; background: var(--stand-tab); color: var(--stand-ink); }
.tabs button[aria-pressed="true"] { background: var(--stand-on); color: var(--stand-on-ink); }
.tabs button:focus-visible { outline: 3px solid #3B82F6; outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 32px 24px; justify-items: center; }
.item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.item > span { font-size: 13px; color: var(--stand-muted); text-align: center; max-width: 320px; }
.item > span b { color: var(--stand-ink); font-weight: 600; }

/* Телефон и токены варианта 4 «Дорога месяца» */
.phone { width: 340px; max-width: calc(100vw - 32px); height: 700px; border-radius: 36px; padding: 10px; background: #2A2F36; }
.screen {
  --bg: #EDF1F0; --surface: #FFFFFF; --ink: #142326; --muted: #586B6F; --line: #C9D6D4; --soft: #DCE5E4;
  --primary: #0D6170; --on-primary: #FFFFFF; --tonal: #D5ECEE; --on-tonal: #0A4A55; --chip: #E3EEED;
  --normal: #1E7F45; --over: #C2312A; --error-bg: #F9DEDB; --scrim: rgba(20,35,38,.42);
  --plate-bg: #FFFFFF; --plate-ink: #142326; --plate-line: #142326;
  position: relative; height: 100%; overflow: hidden; border-radius: 28px;
  background: var(--bg); color: var(--ink); font: 15px/1.35 "Onest", system-ui, sans-serif;
  display: flex; flex-direction: column;
}
.screen.dark {
  --bg: #0E1719; --surface: #172326; --ink: #E3EEEF; --muted: #93A9AD; --line: #34494D; --soft: #27393D;
  --primary: #5CC7D6; --on-primary: #062A31; --tonal: #1D4248; --on-tonal: #C8F0F5; --chip: #223438;
  --normal: #5BCB86; --over: #FF8A80; --error-bg: #47201D; --scrim: rgba(0,0,0,.55);
  --plate-bg: #E3EEEF; --plate-ink: #0E1719; --plate-line: #E3EEEF;
}
.num { font-family: "Nunito", "Onest", sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; }
.statusbar { height: 28px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 12px; color: var(--muted); }
.appbar { flex: none; display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 0 8px 0 4px; }
.appbar h2 { flex: 1; margin: 0 0 0 4px; font-size: 20px; font-weight: 600; }
.icon-btn { width: 44px; height: 44px; border: 0; background: none; color: var(--ink); border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.content { flex: 1; overflow-y: auto; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: none; }
.content::-webkit-scrollbar { display: none; }
button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* Поля ввода (Material 3 outlined) */
.field { position: relative; }
.field .box {
  display: flex; align-items: center; gap: 8px; min-height: 54px; padding: 0 14px;
  border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface);
}
.field.focus .box { border: 2px solid var(--primary); }
.field.error .box { border-color: var(--over); }
.field .lbl { position: absolute; left: 10px; top: -8px; padding: 0 4px; font-size: 12px; color: var(--muted); background: var(--bg); }
.field.on-surface .lbl { background: var(--surface); }
.field.focus .lbl { color: var(--primary); }
.field.error .lbl { color: var(--over); }
.field .value { flex: 1; font-size: 16px; }
.field .placeholder { flex: 1; font-size: 16px; color: var(--muted); }
.field .icon { width: 22px; height: 22px; color: var(--muted); flex: none; }
.field .hint { font-size: 12px; color: var(--muted); margin: 4px 14px 0; }
.field.error .hint { color: var(--over); }
.caret { display: inline-block; width: 2px; height: 20px; background: var(--primary); vertical-align: -4px; margin-left: 1px; }

/* Кнопки */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; padding: 8px 16px; text-align: center; border: 0; border-radius: 14px; font: 600 16px "Onest", sans-serif; cursor: pointer; }
.btn svg { width: 20px; height: 20px; }
.btn.filled { background: var(--primary); color: var(--on-primary); }
.btn.tonal { background: var(--tonal); color: var(--on-tonal); }
.btn.outline { background: none; color: var(--primary); box-shadow: 0 0 0 1.5px var(--line) inset; }
.btn.disabled { background: var(--soft); color: var(--muted); }
.link { border: 0; background: none; color: var(--primary); font: 600 15px "Onest", sans-serif; padding: 8px 0; cursor: pointer; text-align: center; }
.small { font-size: 13px; color: var(--muted); }
.center { text-align: center; }

/* Дорога-шаги на экранах входа */
.steps { margin: 8px 0 4px; }
.track { position: relative; height: 26px; margin-right: 14px; }
.lane { position: absolute; left: 0; right: 0; bottom: 6px; height: 4px; border-radius: 2px; background: var(--soft); }
.done { position: absolute; left: 0; bottom: 6px; height: 4px; border-radius: 2px; background: var(--primary); }
.car { position: absolute; bottom: 7px; width: 34px; height: 18px; transform: translateX(-50%); color: var(--primary); }
.flag { position: absolute; right: -14px; bottom: 4px; width: 16px; height: 22px; color: var(--muted); }
.steps-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-right: 14px; }
.steps-scale .now { color: var(--primary); font-weight: 600; }
.hero-title { font-size: 26px; font-weight: 700; margin: 8px 0 0; letter-spacing: -0.01em; }
.hero-sub { margin: 0; color: var(--muted); }

/* Ячейки кода — как ячейки одометра */
.code { display: flex; gap: 8px; justify-content: center; margin: 8px 0; }
.code span { width: 42px; height: 54px; border-radius: 12px; display: grid; place-items: center; font: 800 26px "Nunito", sans-serif; background: var(--surface); border: 1.5px solid var(--line); }
.code span.filled { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.code span.cur { border: 2px solid var(--primary); }

/* Госномер */
.plate { display: inline-flex; align-items: stretch; border: 1.5px solid var(--plate-line); border-radius: 4px; background: var(--plate-bg); color: var(--plate-ink); font: 600 13px/1 "Onest", sans-serif; letter-spacing: .04em; }
.plate b { padding: 3px 6px; font-weight: 600; }
.plate i { font-style: normal; padding: 1px 4px; border-left: 1.5px solid var(--plate-line); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; }
.plate i small { font-size: 6px; letter-spacing: .08em; }

/* Список авто */
.car-card { position: relative; background: var(--surface); border-radius: 22px; padding: 14px 12px 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.car-card.selected { box-shadow: 0 0 0 2px var(--primary) inset; }
.car-top { display: flex; align-items: center; gap: 8px; }
.car-top h3 { margin: 0; flex: 1; font-size: 18px; font-weight: 600; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px 0 8px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-size: 12.5px; font-weight: 600; }
.badge svg { width: 15px; height: 15px; }
.chip { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--chip); color: var(--on-tonal); font-size: 13px; font-weight: 600; }
.car-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.norms { display: flex; gap: 14px; font-size: 14px; color: var(--muted); }
.norms .num { color: var(--ink); font-size: 15px; }
.more { flex: none; border: 0; background: var(--chip); color: var(--on-tonal); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
.more svg { width: 18px; height: 18px; }
.fab { position: absolute; right: 16px; bottom: 20px; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 20px 0 16px; border: 0; border-radius: 18px; cursor: pointer; background: var(--primary); color: var(--on-primary); font: 600 15px "Onest", sans-serif; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
.fab svg { width: 22px; height: 22px; }

/* Нормы в форме авто */
.group-title { font-size: 15px; font-weight: 600; margin: 4px 0 -4px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Лента (фон под шторками) и пустая лента */
.feed-head { flex: none; display: flex; align-items: center; gap: 4px; padding: 4px 8px 8px 16px; }
.feed-head .title { flex: 1; }
.feed-head .name { font-size: 20px; font-weight: 600; }
.ghost-card { margin: 0 12px 12px; height: 210px; border-radius: 22px; background: var(--surface); }
.empty { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 28px 120px; text-align: center; }
.empty .track { margin: 0 14px 0 0; }
.empty p { margin: 0; }
.empty .big { font-size: 18px; font-weight: 600; }

/* Шторки и диалоги */
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 28px 28px 0 0; padding: 10px 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.handle { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 4px; }
.sheet h3, .dialog h3 { margin: 0; font-size: 20px; font-weight: 600; }
.rf-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--soft); }
.rf-date { width: 46px; flex: none; font: 700 15px "Nunito", sans-serif; }
.rf-main { flex: 1; min-width: 0; }
.rf-main .num { font-size: 15px; }
.rf-main .small { display: block; }
.rf-sum { font: 700 15px "Nunito", sans-serif; white-space: nowrap; }
.trash { width: 36px; height: 36px; border: 0; background: none; color: var(--muted); border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; }
.trash svg { width: 20px; height: 20px; }
.total { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
.total .num { font-size: 17px; }
.sum-line { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; border-radius: 12px; background: var(--chip); }
.sum-line .num { font-size: 22px; }
.dialog { position: absolute; left: 20px; right: 20px; top: 50%; transform: translateY(-50%); background: var(--surface); border-radius: 28px; padding: 22px 20px 14px; display: flex; flex-direction: column; gap: 16px; }
.actions { display: flex; justify-content: flex-end; gap: 4px; }
.actions .link { padding: 10px 14px; }
.month-pick { display: flex; align-items: center; justify-content: space-between; height: 54px; border-radius: 12px; border: 1.5px solid var(--line); padding: 0 4px; }
.month-pick b { font-size: 17px; font-weight: 600; }
.segmented { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.segmented span { display: flex; align-items: center; justify-content: center; gap: 6px; height: 42px; font-weight: 600; font-size: 15px; }
.segmented span + span { border-left: 1.5px solid var(--line); }
.segmented span.on { background: var(--tonal); color: var(--on-tonal); }
.segmented svg { width: 16px; height: 16px; }

/* Профиль */
.section { background: var(--surface); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.section h4 { margin: 0; font-size: 16px; font-weight: 600; }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.kv .k { color: var(--muted); font-size: 14px; }
.row-inline { display: flex; gap: 8px; align-items: flex-start; }
.row-inline .field { flex: 1; }
.row-inline .btn { width: auto; padding: 0 16px; height: 54px; }
.ok { display: flex; align-items: center; gap: 8px; color: var(--normal); font-weight: 500; font-size: 14px; }
.ok svg { width: 18px; height: 18px; }
.footer { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 0; }
.danger { color: var(--over); }
.info { display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--chip); font-size: 14px; }
.info svg { width: 20px; height: 20px; flex: none; color: var(--primary); margin-top: 1px; }

/* Загрузка: машинка едет по кругу дороги, пока идёт синхронизация */
.loading { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 32px 80px; text-align: center; }
.loading .track { margin: 0; }
.loading .car { left: 50%; }
@media (prefers-reduced-motion: no-preference) {
  .loading .car { animation: drive 2.4s cubic-bezier(.45,.05,.55,.95) infinite; }
  .loading .done { animation: fill 2.4s cubic-bezier(.45,.05,.55,.95) infinite; }
}
@keyframes drive { from { left: 17px; } to { left: calc(100% - 17px); } }
@keyframes fill { from { width: 17px; } to { width: calc(100% - 17px); } }
</style>
</head>
<body>
<main class="stand">
  <h1>Экраны приложения в стиле «Дорога месяца»</h1>
  <p>Все экраны, кроме главного (он в соседнем файле index.html). Тексты и поля — как в приложении сейчас. Переключите тему кнопками ниже.</p>
  <div class="tabs" role="group" aria-label="Тема">
    <button data-theme="light" aria-pressed="true">Светлая тема</button>
    <button data-theme="dark" aria-pressed="false">Тёмная тема</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<script>
const icon = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4"/><path d="M3 8h13"/><path d="m17 20 4-4-4-4"/><path d="M21 16H8"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18.5" cy="12" r="2"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  eye: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  cal: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  down: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4.5h6V7"/></svg>',
  sync: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
  snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v19M3.8 7.25l16.4 9.5M3.8 16.75l16.4-9.5"/><path d="m9.5 4 2.5 2 2.5-2M9.5 20l2.5-2 2.5 2"/></svg>',
};
const carSvg = '<svg class="car" viewBox="0 0 34 18" fill="currentColor" aria-hidden="true"><path d="M2 12.6V9.6c0-1 .6-1.8 1.6-2L6 7l3.4-4.1C9.9 2.3 10.6 2 11.4 2h6.8c.8 0 1.5.3 2 .9L23.6 7l6.8 1.1c1 .2 1.6 1 1.6 2v2.5c0 .7-.6 1.3-1.3 1.3H3.3C2.6 13.9 2 13.3 2 12.6z"/><path d="M7.6 6.9l2.7-3.3H14v3.3zM15.2 3.6H18l3 3.3h-5.8z" style="fill:var(--surface)"/><rect x="29.6" y="9" width="2.2" height="1.6" rx=".6" style="fill:var(--surface)"/><circle cx="8.5" cy="14" r="3"/><circle cx="25.5" cy="14" r="3"/><circle cx="8.5" cy="14" r="1.2" style="fill:var(--surface)"/><circle cx="25.5" cy="14" r="1.2" style="fill:var(--surface)"/></svg>';
const flagSvg = '<svg class="flag" viewBox="0 0 16 22" aria-hidden="true"><path d="M2 1v20" stroke="currentColor" stroke-width="1.8"/><path d="M2.9 2h11v8h-11z" fill="currentColor" opacity=".25"/><path d="M2.9 2h2.75v2h-2.75zM8.4 2h2.75v2H8.4zM5.65 4H8.4v2H5.65zM11.15 4h2.75v2h-2.75zM2.9 6h2.75v2h-2.75zM8.4 6h2.75v2H8.4zM5.65 8H8.4v2H5.65zM11.15 8h2.75v2h-2.75z" fill="currentColor"/></svg>';

// --- Помощники разметки ---
const status = '<div class="statusbar"><span>12:30</span><span>●●● ▮</span></div>';
const appbar = (title, back = true, extra = "") =>
  `<header class="appbar">${back ? `<button class="icon-btn" aria-label="Назад">${icon.back}</button>` : '<span style="width:12px"></span>'}<h2>${title}</h2>${extra}</header>`;
const plate = (num, reg) => `<span class="plate"><b>${num}</b><i>${reg}<small>RUS</small></i></span>`;
function field(label, value, o = {}) {
  const cls = ["field", o.focus && "focus", o.error && "error", o.onSurface && "on-surface"].filter(Boolean).join(" ");
  const val = value
    ? `<span class="value ${o.num ? "num" : ""}">${value}${o.focus ? '<span class="caret"></span>' : ""}</span>`
    : `<span class="placeholder">${o.placeholder ?? ""}</span>`;
  return `<div class="${cls}"><div class="box">${val}${o.trail ?? ""}</div><span class="lbl">${label}</span>${o.hint ? `<div class="hint">${o.hint}</div>` : ""}</div>`;
}
const pos = f => `calc(17px + (100% - 34px) * ${f})`;
function road(f, labels) {
  return `
    <div class="steps">
      <div class="track"><div class="lane"></div><div class="done" style="width:${pos(f)}"></div>${flagSvg}<div style="position:absolute;inset:0">${carSvg.replace('class="car"', `class="car" style="left:${pos(f)}"`)}</div></div>
      ${labels ? `<div class="steps-scale">${labels}</div>` : ""}
    </div>`;
}

function render(dark) {
  document.getElementById("grid").innerHTML = screens.map((s, i) => `
    <div class="item">
      <div class="phone"><div class="screen ${dark ? "dark" : ""}">${status}${s.html}</div></div>
      <span><b>${i + 1}. ${s.name}</b><br>${s.note}</span>
    </div>`).join("");
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render(b.dataset.theme === "dark");
}));
render(false);
